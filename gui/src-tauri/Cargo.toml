[package]
name = "paat-dashboard"
version = "0.5.0"
edition = "2021"
description = "Port Authority Agent Terminal — dashboard"
authors = ["charlesonogwu"]
license = "MIT"

[lib]
name = "paat_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Native window control for the hide-watcher thread (enumerate + move windows
# off-screen in microseconds, no PowerShell). Windows-only.
[target.'cfg(windows)'.dependencies]
# Preserve main's Windows release inspection support.
tauri = { version = "2", features = ["devtools"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }

# The legacy CLI launcher is used on Windows and Linux, never on Mac.
[target.'cfg(not(target_os = "macos"))'.dependencies]
which = "8"
