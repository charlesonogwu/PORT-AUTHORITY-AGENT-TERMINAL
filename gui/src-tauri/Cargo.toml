[package]
name = "paat-dashboard"
version = "0.2.0"
edition = "2021"
description = "Port Authority Agent Terminal — dashboard"
authors = ["charlesonogwu"]
license = "MIT"

[lib]
name = "paat_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` enables F12 + right-click → Inspect Element in release builds.
# v0.2.0/0.2.1 shipped without this so when the React UI failed to mount the
# user saw a blank white window with no way to see what went wrong. v0.2.2
# enables it permanently for easier user-side debugging.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
which = "8"

# Native window control for the hide-watcher thread (enumerate + move windows
# off-screen in microseconds, no PowerShell). Windows-only.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
