# Continuous Integration for Port Authority Agent Terminal (paat).
#
# Cross-platform as of v0.2.0: Windows ships the prebuilt
# bin/paat-dashboard.exe; macOS builds from source via the postinstall
# hook. CI runs on both runners to keep both paths honest.
#
# Triggers:
#   • Every PR into main
#   • Every push to main (so the tip is always known-good)
#   • Manual dispatch from the Actions tab
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }} generic hosted runner (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        # Node 22.4 is the supported runtime floor: CDP and WebDriver BiDi use
        # Node's native WebSocket. macos-latest is a generic hosted runner, not
        # an Apple-silicon compatibility claim.
        os: [windows-latest, macos-latest]
        node: ["22.x", "24.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Report generic macOS runner architecture
        if: runner.os == 'macOS'
        run: uname -m && sw_vers

      - name: Install root deps
        run: npm ci --no-audit --no-fund
        env:
          # Don't run the full postinstall (shortcut + autostart + Tauri
          # build) inside CI — we only need the deps for type-check and
          # tests. The Tauri binary is exercised by its own job below.
          PAAT_SKIP_POSTINSTALL: "1"

      - name: Type-check
        run: npm run lint

      - name: Build server (tsc only)
        run: npm run build:server

      - name: Unit + integration tests
        run: node --test --test-reporter=spec dist/tests/*.test.js
        shell: bash

      - name: Smoke-test the CLI
        run: |
          node dist/src/cli/index.js help
          node dist/src/cli/index.js list --json
        shell: bash

  # Separate job: actually build the Tauri dashboard binary. This is what
  # proves the cross-platform GUI install path works. We don't gate releases
  # on Linux because PAAT isn't officially supported there yet.
  build-dashboard:
    name: Build Tauri dashboard on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gui/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('gui/src-tauri/Cargo.lock') }}

      - name: Install root deps (skip postinstall)
        run: npm ci --no-audit --no-fund
        env:
          PAAT_SKIP_POSTINSTALL: "1"

      - name: Install gui deps
        run: npm --prefix gui ci --no-audit --no-fund

      - name: Install tauri-cli
        run: cargo install tauri-cli --version ^2 --locked

      - name: Build dashboard
        run: node scripts/build-dashboard-tauri.cjs --strict

      - name: Verify bin/ artifact exists
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f bin/paat-dashboard.exe || { echo "missing bin/paat-dashboard.exe"; exit 1; }
            echo "Windows binary OK: $(stat -c%s bin/paat-dashboard.exe 2>/dev/null || wc -c < bin/paat-dashboard.exe) bytes"
          else
            ARCH=$(node -p "process.arch")
            test -f "bin/paat-dashboard-darwin-${ARCH}" || { echo "missing bin/paat-dashboard-darwin-${ARCH}"; exit 1; }
            echo "macOS binary OK: $(stat -f%z "bin/paat-dashboard-darwin-${ARCH}" 2>/dev/null) bytes"
          fi
