# Continuous Integration for Port Authority Agent Terminal (paat).
#
# Windows-only on purpose: paat is a Windows-first tool. The Mac/Linux code
# paths in src/core/scanner.ts + src/dashboard/kill.ts exist as best-effort
# fallbacks; we don't gate releases on them.
#
# Triggers:
#   • Every PR into main
#   • Every push to main (so the tip is always known-good)
#   • Manual dispatch from the Actions tab
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Node 18 was dropped 2026-05-10:
        # - Reached end-of-life April 2025 (no security patches upstream).
        # - Ships with an npm version that has bug npm/cli#4828 (rollup
        #   native binding install fails for vite). Vite build fails with
        #   "Cannot find native binding" on Windows runners. The bug is
        #   fixed in npm bundled with Node 20+, so dropping the version is
        #   strictly easier than maintaining a workaround for an EOL Node.
        # If anyone shows up needing Node 18 support, fix engines and
        # add it back here together.
        node: ["20.x", "22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install root deps
        run: npm ci --no-audit --no-fund

      - name: Install dashboard-ui deps
        run: npm --prefix dashboard-ui/portpilot-dashboard ci --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Build (dashboard + server)
        run: npm run build

      - name: Unit + integration tests
        run: node --test --test-reporter=spec dist/tests/*.test.js
        shell: bash

      - name: Smoke-test the CLI
        run: |
          node dist/src/cli/index.js help
          node dist/src/cli/index.js list --json
        shell: bash
